# Builds the site and publishes it to GitHub Pages.
# A missing quote or comma in a data file fails here with the file and line,
# and the previously published version stays live.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # build_team.py shells out to node twice to read site/team-data.js
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        run: python3 build_team.py

      - name: Check the expected pages were produced
        run: |
          n=$(ls site/*.html | wc -l)
          echo "generated $n pages in site/"
          test "$n" -ge 40
          test -f site/about.html
          test -f site/team.html
          test -d site/apartment-broker

      - name: Confirm the build is reproducible
        run: |
          find site -name '*.html' -print0 | sort -z | xargs -0 sha256sum > /tmp/a
          python3 build_team.py
          find site -name '*.html' -print0 | sort -z | xargs -0 sha256sum > /tmp/b
          diff /tmp/a /tmp/b && echo "build is idempotent"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<section class="section dark" id="contact">
    <div class="wrap split">
      <div>
        <h2>Contact</h2>
        <p class="lead">Thinking about selling, exchanging or buying? Let's talk.</p>
        <address>
          <p>RE/MAX One Commercial<br>2601 Ocean Park Blvd, Ste 311<br>Santa Monica, CA 90405</p>
          <p><a href="tel:+13103835927">(310) 383-5927</a><br><a href="mailto:Chase@remaxonecommercial.com">Chase@remaxonecommercial.com</a></p>
        </address>
      </div>
      <form class="form on-dark" action="#" method="post" data-form data-subject="New website message"><input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
        <div class="field"><label for="c-name">Full name</label><input id="c-name" name="name" autocomplete="name" required></div>
        <div class="field"><label for="c-email">Email</label><input id="c-email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="c-msg">How can we help?</label><textarea id="c-msg" name="message" rows="4"></textarea></div>
        <button class="btn btn-light" type="submit">Send message</button>
        <p class="form-msg" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>
